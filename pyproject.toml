[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf_to_markdown"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=5.6.0",
    "nltk>=3.9.1",
    "mdutils",
    "pypandoc",
    # The pypandoc-binary 1.17 macOS arm64 wheel bundles an x86_64 pandoc that
    # cannot run: on Apple Silicon the system pandoc (brew install pandoc) is used.
    "pypandoc-binary; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = ["black", "pytest>=8.0", "pytest-cov", "fpdf2"]

[tool.setuptools]
packages = ["pdf_to_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]
